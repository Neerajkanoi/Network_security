<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .result-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }
        .result-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }
        .safe {
            color: #4ade80;
        }
        .phishing {
            color: #ef4444;
        }
        .url-text {
            word-break: break-all;
            color: var(--text-muted);
            margin: 1.5rem 0;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <div class="result-card">
            {% if is_phishing %}
                <div class="icon phishing">⚠️</div>
                <h2 class="phishing">Phishing Detected</h2>
                <p>This website shows indicators of being a phishing or malicious site. Proceed with extreme caution.</p>
            {% else %}
                <div class="icon safe">✅</div>
                <h2 class="safe">Website Appears Safe</h2>
                <p>Our model did not detect any structural or network indicators of phishing.</p>
            {% endif %}
            
            <div class="url-text">
                {{ url }}
            </div>
            
            <a href="/" class="btn btn-primary" style="margin-top: 1rem; text-decoration: none;">Scan Another URL</a>
        </div>
    </div>
</body>
</html>
